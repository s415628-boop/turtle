<h1>烏龜是什麼？</h1>

<img src="https://images.chinatimes.com/newsphoto/2020-11-13/656/20201113002229.jpg" width="400">

<div>烏龜是一種爬蟲類動物，最大的特色就是身上的龜殼。</div>

<div>牠們行動速度比較慢，但有很好的保護能力。</div>

<p>

</p>

<h1>烏龜的特色</h1>

<div>烏龜遇到危險時，可以把頭和四肢縮進龜殼裡。</div>

<div>牠們有些生活在陸地上，有些則生活在水中。</div>

<span class="a">烏龜的壽命通常很長！</span>

<span>牠們需要適合的環境才能健康成長。</span>

<span id="b">保護烏龜，愛護自然環境！</span>

<p>
    烏龜雖然走得很慢，但牠們是一種非常有特色的動物。
    <span class="c">「慢慢走，也能到達目的地。」</span>
</p>

<p>
